name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and run regression tests
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify standard project
        shell: pwsh
        run: |
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/MSBuild.exe" src/LeapworkBuildManager/LeapworkBuildManager.csproj /t:Rebuild /p:Configuration=Release /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild failed' }
      - name: Test release consistency checks
        shell: pwsh
        run: ./scripts/test-release-check.ps1
      - name: Retain regression reports and window captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 14
