name: Label pull requests
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read trusted base-branch configuration through the API; never check out PR code.
      - uses: actions/labeler@v7
        with:
          sync-labels: false
